name: Agent task contract
description: Define the goal, boundaries, and acceptance criteria for an agent task.
title: "[Agent task] "
labels:
  - agent-task
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: context_links
    attributes:
      label: Context links
  - type: input
    id: in_scope_paths
    attributes:
      label: In-scope paths
    validations:
      required: true
  - type: input
    id: out_of_scope
    attributes:
      label: Out of scope
      value: "alembic/, .github/, pyproject.toml, any new dependency"
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: stop_and_ask
    attributes:
      label: Stop and ask a human if
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Reviewer
